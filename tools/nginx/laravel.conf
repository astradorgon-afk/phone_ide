# nginx server block for a Laravel project, fronted by the `php-cgi` FastCGI SAPI.
#
# This is a DROP-IN for the nginx bundle (tools/build-nginx.sh). It assumes a single project
# whose document root is Laravel's `public/`, which is the only directory that should ever be
# exposed — the application root holds `.env`, `storage/` and `vendor/`, and serving it by
# mistake publishes the database password.
#
# The FastCGI upstream is `php-cgi`, which already ships in the `php` bundle:
#
#     $PREFIX/bin/php-cgi -b 127.0.0.1:9000 -c $PREFIX/lib/php.ini
#
# `php-fpm` is not required for a single site; `php-cgi -b` speaks the same FastCGI protocol.
# Start it before nginx and stop it after.
#
# Placeholders replaced when the bundle is used in-app:
#   __PROJECT_ROOT__  absolute path to the Laravel project (the parent of public/)
#   __PREFIX__        the toolchain prefix, e.g. /data/data/dev.mobileforge/files/usr

server {
    listen       127.0.0.1:8080;
    server_name  _;

    # Laravel's only public directory.
    root  __PROJECT_ROOT__/public;
    index index.php index.html;

    charset utf-8;

    # Front controller: routes that do not match a real file go to Laravel, not nginx's 404.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-lived static assets, if the app ever emits any.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;

        # The script has to be the resolved path under the document root. Getting this wrong is
        # the classic "File not found" from PHP-FPM/CGI: the request URI is passed through and
        # PHP looks for the file relative to its own working directory, which is not the root.
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
    }

    # Never hand out dotfiles or the VCS metadata that sits beside them.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
